plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('NEXO_RELEASE_KEYSTORE') ?: "${System.properties['user.home']}/.nexo-release/nexo-release.p12"
def releaseStorePassword = System.getenv('NEXO_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('NEXO_KEY_PASSWORD') ?: releaseStorePassword
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (releaseRequested) {
    if (!file(releaseKeystorePath).exists()) {
        throw new GradleException("Clave Release no encontrada en ${releaseKeystorePath}. Ejecuta: sh setup-release-key.sh")
    }
    if (!releaseStorePassword) {
        throw new GradleException('Falta NEXO_STORE_PASSWORD. Usa build-on-phone.sh para compilar la Release.')
    }
}

android {
    namespace 'com.jruiz.nexo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jruiz.nexo'
        minSdk 26
        targetSdk 34
        versionCode 177
        versionName '3.7.84'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (file(releaseKeystorePath).exists() && releaseStorePassword) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias 'nexo-release'
                keyPassword releaseKeyPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The E2EE classes under app/src/main/java/com/jruiz/nexo/connect
    // belong to :connectVault. Compile them only once: in that library.
    // Connect UI lives in this app's process in both build variants.
    sourceSets {
        main {
            java.exclude 'com/jruiz/nexo/connect/*.java'
        }
        main {
            java.srcDir rootProject.file('experiments/nexo-connect-android-vault/pilot/src/main/java')
        }
    }
}


dependencies {
    implementation files('libs/sherpa-onnx-1.13.7.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    // Connect and Chat are part of Nexo in both build variants.
    implementation project(':connectVault')
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.crypto.tink:tink:1.18.0'
}
