plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('NEXO_RELEASE_KEYSTORE') ?: "${System.properties['user.home']}/.nexo-release/nexo-release.p12"
def releaseStorePassword = System.getenv('NEXO_STORE_PASSWORD')
def releaseKeyPassword = System.getenv('NEXO_KEY_PASSWORD') ?: releaseStorePassword
def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }

if (releaseRequested) {
    if (!file(releaseKeystorePath).exists()) {
        throw new GradleException("Clave Release no encontrada en ${releaseKeystorePath}. Ejecuta: sh setup-release-key.sh")
    }
    if (!releaseStorePassword) {
        throw new GradleException('Falta NEXO_STORE_PASSWORD. Usa build-on-phone.sh para compilar la Release.')
    }
}

android {
    namespace 'com.jruiz.nexo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jruiz.nexo'
        minSdk 26
        targetSdk 34
        versionCode 71
        versionName '3.7.0-beta6'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        release {
            if (file(releaseKeystorePath).exists() && releaseStorePassword) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias 'nexo-release'
                keyPassword releaseKeyPassword
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation files('libs/sherpa-onnx-1.13.7.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
