name: Nexo beta22 final validation

on:
  pull_request:
    branches:
      - release/nexo-3.7.0-beta21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          DIR="${RUNNER_TEMP}/gradle-8.9"
          SHA="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          curl -L --fail --retry 3 -o "${ZIP}" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          [ "$(sha256sum "${ZIP}" | awk '{print $1}')" = "${SHA}" ]
          unzip -q "${ZIP}" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${DIR}/bin/gradle" >> "${GITHUB_ENV}"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Prepare transcription runtime
        run: sh prepare-transcription-runtime.sh

      - name: Static and existing regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          sh -n build-on-phone.sh
          python3 validation/test-version-identity.py
          python3 validation/test-beta16-time-voice.py
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          python3 validation/test-event-people-assignment.py
          python3 validation/test-form-familia-ui.py
          python3 validation/test-branding-resources.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv

      - name: Home titles only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/index.html').read_text()
          for text in ('Resumen familiar','Accesos rápidos','Agenda familiar'):
              assert f'<p class="section-kicker">{text}</p>' not in h
          for text in ('Lo importante ahora','Accesos directos','Próximamente'):
              assert text in h
          print('Home: solo títulos negros solicitados: OK')
          PY

      - name: Audit P0-P2 smoke tests
        shell: bash
        run: |
          cat > /tmp/NexoAuditFinalSmoke.java <<'JAVA'
          package com.jruiz.nexo.core;

          import java.time.*;
          import java.util.*;
          import org.json.JSONObject;

          public final class NexoAuditFinalSmoke {
              static void check(boolean v,String m){if(!v)throw new AssertionError(m);}
              static String n(String s){return TemporalParser.norm(s);}
              public static void main(String[] args) throws Exception {
                  LocalDateTime now=LocalDateTime.of(2026,10,1,10,0);

                  TemporalParser.Result corrected=TemporalParser.parse(
                    "Cita mañana a las seis, perdón, a las siete de la tarde durante cuarenta y cinco minutos",now);
                  check(corrected.hasDate && LocalDate.of(2026,10,2).equals(corrected.date),"fecha relativa");
                  check(corrected.hasTime && LocalTime.of(19,0).equals(corrected.time),"hora corregida");
                  check(corrected.durationMinutes()==45,"duración 45");

                  TemporalParser.Result invalid=TemporalParser.parse("Cita el 31 de febrero de 2027 a las 10:00",now);
                  check(invalid.invalidDate && !invalid.hasDate,"fecha imposible");

                  RuleClassifier.Result rem=RuleClassifier.classify(
                    "Cita mañana a las 10:00. Avísame una hora y media antes");
                  check(rem.reminderLeadMinutes.contains(90),"aviso 90");
                  check("event".equals(rem.type),"aviso no cambia cita");

                  String doc="Llevar el informe del 12 de septiembre. Cita el 8 de octubre de 2026 a las 10:00";
                  TemporalParser.Result docDate=TemporalParser.parse(doc,now);
                  check(LocalDate.of(2026,10,8).equals(docDate.date),"fecha documental separada");
                  check(n(DescriptionExtractor.extract(doc,"")).contains("informe del 12 de septiembre"),"informe conservado");

                  String rich="Cita para revisión del implante en Clínica Roble con la doctora Vega el 8 de octubre de 2026";
                  check("Clínica Roble".equals(LocationParser.extract(rich)),"clínica sin profesional");
                  check(n(DescriptionExtractor.extract(rich,"Clínica Roble")).contains("doctora vega"),"profesional conservado");

                  List<AppointmentParser.Proposal> proposals=AppointmentParser.parseProposals(
                    "Tengo cita con el dentista el 6 de octubre de 2026 a las 10:00 y reunión de presupuesto el 7 de octubre de 2026 a las 17:00");
                  check(proposals.size()==2,"dos propuestas");

                  RecurrenceEngine.Detection rec=RecurrenceEngine.detect(
                    "Consulta todos los lunes, miércoles y viernes del 5 de octubre de 2026 al 16 de octubre de 2026 a las 10:00");
                  check("FREQ=WEEKLY;BYDAY=MO,WE,FR".equals(rec.recurrenceRule),"BYDAY");

                  RuleClassifier.Result bad=RuleClassifier.classify("Cita el 31 de febrero de 2027 a las 10:00");
                  JSONObject meta=bad.toJson().optJSONObject("fieldMeta");
                  check(meta!=null && "invalid".equals(meta.optJSONObject("date").optString("state")),"fieldMeta date invalid");
                  check(bad.needsReview,"needsReview");

                  String virtual="El 8 de octubre de 2026 reunión con Laura por Meet enlace es https://meet.google.com/abc-defg-hi";
                  check("Reunión con Laura".equals(LocalTitleEngine.derive(virtual,"event","Trabajo","",DescriptionExtractor.extract(virtual,""))),"Meet title");
                  check(DescriptionExtractor.extract(virtual,"").contains("https://meet.google.com/abc-defg-hi"),"Meet link");
                  check(LocationParser.extract(virtual).isBlank(),"Meet no físico");

                  String r28="Título revisión anual ubicación Clínica Roble descripción llevar informe y tarjeta";
                  check("revision anual".equals(n(EventSemanticParser.guidedTitle(r28))),"etiqueta título");
                  check("Clínica Roble".equals(LocationParser.extract(r28)),"etiqueta ubicación");
                  check(n(DescriptionExtractor.extract(r28,"Clínica Roble")).contains("llevar informe y tarjeta"),"etiqueta descripción");

                  String r48="Cita el 8 de octubre de 2026 a las 10:00. Llevar el informe de la mañana";
                  check(n(DescriptionExtractor.extract(r48,"")).contains("llevar el informe de la manana"),"instrucción de la mañana");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp/nexo-parser-regression -d /tmp/nexo-parser-regression             app/src/main/java/com/jruiz/nexo/core/AppointmentParser.java             /tmp/NexoAuditFinalSmoke.java
          java -cp /tmp/nexo-parser-regression com.jruiz.nexo.core.NexoAuditFinalSmoke

      - name: Service review-state guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/jruiz/nexo/core/NexoService.java').read_text()
          block=p[p.index('public JSONObject classifyAppointment'):p.index('private void applyLearnedCategory')]
          assert 'r.needsReview = false' not in block
          assert 'r.reason = ""' not in block
          save=p[p.index('public JSONObject saveCapture'):p.index('public JSONObject updateItem')]
          assert 'in.put("needsReview", false)' not in save
          assert 'auto.needsReview' in save
          print('needsReview preservado: OK')
          PY

      - name: Compile Android debug
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "${GRADLE_89}" assembleDebug --no-daemon --max-workers=1
