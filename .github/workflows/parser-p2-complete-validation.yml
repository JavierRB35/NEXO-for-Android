name: Parser P2 completeness validation

on:
  pull_request:
    branches:
      - work/nexo-beta21-parser-p2-current
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          GRADLE_DIR="${RUNNER_TEMP}/gradle-8.9"
          EXPECTED_SHA256="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          curl -L --fail --retry 3 -o "${GRADLE_ZIP}" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          ACTUAL_SHA256="$(sha256sum "${GRADLE_ZIP}" | awk '{print $1}')"
          [ "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}" ]
          unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${GRADLE_DIR}/bin/gradle" >> "${GITHUB_ENV}"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-34"

      - name: Prepare transcription runtime
        run: sh prepare-transcription-runtime.sh

      - name: Existing regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          sh -n build-on-phone.sh
          python3 validation/test-version-identity.py
          python3 validation/test-beta16-time-voice.py
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          python3 validation/test-event-people-assignment.py
          python3 validation/test-form-familia-ui.py
          python3 validation/test-branding-resources.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv

      - name: Semantic completeness smoke tests
        shell: bash
        run: |
          cat > /tmp/SemanticCompleteSmoke.java <<'JAVA'
          package com.jruiz.nexo.core;

          public final class SemanticCompleteSmoke {
              private static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
              private static String n(String x){return TemporalParser.norm(x);}
              public static void main(String[] args) {
                  String r04="El 8 de octubre de 2026 reunión con Laura por Meet enlace es https://meet.google.com/abc-defg-hi";
                  String title=LocalTitleEngine.derive(r04,"event","Trabajo","",DescriptionExtractor.extract(r04,""));
                  String desc=DescriptionExtractor.extract(r04,"");
                  check("Reunión con Laura".equals(title),"R04 título: "+title);
                  check(desc.contains("https://meet.google.com/abc-defg-hi"),"R04 enlace completo");
                  check(n(desc).contains("participante: laura"),"R04 participante");
                  check(LocationParser.extract(r04).isBlank(),"R04 Meet no es ubicación física");

                  String r48="Cita el 8 de octubre de 2026 a las 10:00. Llevar el informe de la mañana";
                  String d48=DescriptionExtractor.extract(r48,"");
                  check(n(d48).contains("llevar el informe de la manana"),"R48 instrucción completa: "+d48);

                  String r28="Título revisión anual ubicación Clínica Roble descripción llevar informe y tarjeta";
                  check("revision anual".equals(n(EventSemanticParser.guidedTitle(r28))),"R28 título guiado");
                  check("Clínica Roble".equals(LocationParser.extract(r28)),"R28 ubicación guiada");
                  String d28=DescriptionExtractor.extract(r28,"Clínica Roble");
                  check(n(d28).contains("llevar informe y tarjeta"),"R28 descripción guiada: "+d28);

                  String longTitle="Reunión de revisión detallada de presupuesto anual con planificación de inversiones";
                  String out=LocalTitleEngine.derive(longTitle,"event","Trabajo","","");
                  check(out.length()>45,"el título semántico no debe truncarse a 45 caracteres");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp/nexo-parser-regression -d /tmp/nexo-parser-regression \
            app/src/main/java/com/jruiz/nexo/core/AppointmentParser.java \
            /tmp/SemanticCompleteSmoke.java
          java -cp /tmp/nexo-parser-regression com.jruiz.nexo.core.SemanticCompleteSmoke

      - name: Compile Android debug
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "${GRADLE_89}" assembleDebug --no-daemon --max-workers=1
