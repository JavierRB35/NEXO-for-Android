name: Nexo Android · APK Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "ERROR: sdkmanager no disponible en el runner."
            exit 1
          fi
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-34"

      - name: Read Nexo version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -n 1)"
          if [ -z "${VERSION_NAME}" ] || [ -z "${VERSION_CODE}" ]; then
            echo "ERROR: no se pudo leer versionName/versionCode."
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "Nexo ${VERSION_NAME} (versionCode ${VERSION_CODE})"

      - name: Check tag matches versionName
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          EXPECTED="v${VERSION_NAME}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "ERROR: el tag ${GITHUB_REF_NAME} no coincide con versionName ${VERSION_NAME}."
            echo "Tag esperado: ${EXPECTED}"
            exit 1
          fi

      - name: Restore permanent Release signing key
        shell: bash
        env:
          NEXO_KEYSTORE_BASE64: ${{ secrets.NEXO_KEYSTORE_BASE64 }}
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${NEXO_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: falta el Repository Secret NEXO_KEYSTORE_BASE64."
            exit 1
          fi
          if [ -z "${NEXO_STORE_PASSWORD:-}" ]; then
            echo "ERROR: falta el Repository Secret NEXO_STORE_PASSWORD."
            exit 1
          fi
          KEYSTORE="${RUNNER_TEMP}/nexo-release.p12"
          printf '%s' "${NEXO_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"
          keytool -list \
            -keystore "${KEYSTORE}" \
            -storetype PKCS12 \
            -storepass "${NEXO_STORE_PASSWORD}" \
            -alias nexo-release >/dev/null

          EXPECTED_CERT_SHA256="595799E351233418F05BC5053E42B3AFF439D677FFBB0F59A1D92E29D15FEC48"
          ACTUAL_CERT_SHA256="$(keytool -exportcert \
            -keystore "${KEYSTORE}" \
            -storetype PKCS12 \
            -storepass "${NEXO_STORE_PASSWORD}" \
            -alias nexo-release \
            -rfc | openssl x509 -noout -fingerprint -sha256 | sed 's/.*=//' | tr -d ':\\r\\n' | tr '[:lower:]' '[:upper:]')"
          if [ "${ACTUAL_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]; then
            echo "ERROR: la clave cargada no corresponde a la identidad Release permanente de Nexo."
            exit 1
          fi
          echo "Firma Release permanente verificada."

      - name: Prepare transcription runtime
        shell: bash
        run: |
          set -euo pipefail
          sh prepare-transcription-runtime.sh

      - name: Run project validation
        shell: bash
        run: |
          set -euo pipefail
          sh validation/validate-project.sh

      - name: Build signed Release APK
        shell: bash
        env:
          NEXO_RELEASE_KEYSTORE: ${{ runner.temp }}/nexo-release.p12
          NEXO_STORE_PASSWORD: ${{ secrets.NEXO_STORE_PASSWORD }}
          NEXO_KEY_PASSWORD: ${{ secrets.NEXO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          gradle assembleRelease --no-daemon --max-workers=1

      - name: Verify and name APK
        id: apk
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          [ -f "${SOURCE_APK}" ] || { echo "ERROR: APK Release no encontrado."; exit 1; }
          mkdir -p dist
          FINAL_APK="dist/Nexo-v${VERSION_NAME}-release.apk"
          cp "${SOURCE_APK}" "${FINAL_APK}"

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "${APKSIGNER}" ]; then
            echo "ERROR: apksigner no disponible."
            exit 1
          fi
          "${APKSIGNER}" verify --verbose --print-certs "${FINAL_APK}"
          echo "path=${FINAL_APK}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-v${{ steps.version.outputs.version_name }}-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          FINAL_APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${FINAL_APK}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${FINAL_APK}"               --title "Nexo ${VERSION_NAME}"               --generate-notes
          fi
