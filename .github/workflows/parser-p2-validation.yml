name: Parser P2 validation

on:
  pull_request:
    branches:
      - release/nexo-3.7.0-beta20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          GRADLE_DIR="${RUNNER_TEMP}/gradle-8.9"
          EXPECTED_SHA256="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          curl -L --fail --retry 3 -o "${GRADLE_ZIP}" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          ACTUAL_SHA256="$(sha256sum "${GRADLE_ZIP}" | awk '{print $1}')"
          [ "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}" ]
          unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${GRADLE_DIR}/bin/gradle" >> "${GITHUB_ENV}"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-34"

      - name: Prepare transcription runtime
        run: sh prepare-transcription-runtime.sh

      - name: Existing regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          python3 validation/test-version-identity.py
          python3 validation/test-beta16-time-voice.py
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          python3 validation/test-event-people-assignment.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv

      - name: P2 parser smoke tests
        shell: bash
        run: |
          cat > /tmp/ParserP2Smoke.java <<'JAVA'
          package com.jruiz.nexo.core;

          import java.time.*;
          import java.util.*;
          import org.json.JSONObject;

          public final class ParserP2Smoke {
              private static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
              public static void main(String[] args) throws Exception {
                  List<AppointmentParser.Proposal> proposals=AppointmentParser.parseProposals(
                      "Tengo cita con el dentista el 6 de octubre de 2026 a las 10:00 y reunión de presupuesto el 7 de octubre de 2026 a las 17:00");
                  check(proposals.size()==2,"dos citas deben producir dos propuestas");
                  check("2026-10-06".equals(proposals.get(0).result.dueDate),"fecha propuesta 1");
                  check("2026-10-07".equals(proposals.get(1).result.dueDate),"fecha propuesta 2");

                  check(AppointmentParser.parseProposals(
                      "Consulta todos los lunes y miércoles a las 10:00").size()==1,
                      "una recurrencia multidía no debe dividirse en citas");

                  RecurrenceEngine.Detection recurrence=RecurrenceEngine.detect(
                      "Consulta todos los lunes, miércoles y viernes del 5 de octubre de 2026 al 16 de octubre de 2026 a las 10:00");
                  check(RecurrenceEngine.WEEKLY.equals(recurrence.recurrence),"recurrencia semanal");
                  check("FREQ=WEEKLY;BYDAY=MO,WE,FR".equals(recurrence.recurrenceRule),"BYDAY");
                  check("2026-10-16".equals(recurrence.untilDate),"fin de serie");

                  ZoneId madrid=ZoneId.of("Europe/Madrid");
                  long base=LocalDate.of(2026,10,5).atTime(10,0).atZone(madrid).toInstant().toEpochMilli();
                  long end=LocalDate.of(2026,10,16).atTime(23,59).atZone(madrid).toInstant().toEpochMilli();
                  List<Long> occ=RecurrenceEngine.occurrencesBetween(
                      base,"weekly","FREQ=WEEKLY;BYDAY=MO,WE,FR",end,base,end,madrid,20);
                  check(occ.size()==6,"se esperaban 6 apariciones L-X-V");

                  RuleClassifier.Result invalid=RuleClassifier.classify(
                      "Cita el 31 de febrero de 2027 a las 10:00");
                  JSONObject meta=invalid.toJson().optJSONObject("fieldMeta");
                  check(meta!=null,"fieldMeta presente");
                  JSONObject dateMeta=meta.optJSONObject("date");
                  check(dateMeta!=null && "invalid".equals(dateMeta.optString("state")),"estado fecha inválida");
                  check(invalid.needsReview,"fecha inválida requiere revisión");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp/nexo-parser-regression -d /tmp/nexo-parser-regression \
            app/src/main/java/com/jruiz/nexo/core/AppointmentParser.java \
            /tmp/ParserP2Smoke.java
          java -cp /tmp/nexo-parser-regression com.jruiz.nexo.core.ParserP2Smoke

      - name: Service review-state guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/jruiz/nexo/core/NexoService.java').read_text()
          block=p[p.index('public JSONObject classifyAppointment'):p.index('private void applyLearnedCategory')]
          assert 'r.needsReview = false' not in block
          assert 'r.reason = ""' not in block
          save=p[p.index('public JSONObject saveCapture'):p.index('public JSONObject updateItem')]
          assert 'in.put("needsReview", false)' not in save
          assert 'auto.needsReview' in save
          print('NexoService preserves parser review state: OK')
          PY

      - name: Compile Android debug
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "${GRADLE_89}" assembleDebug --no-daemon --max-workers=1
