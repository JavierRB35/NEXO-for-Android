name: Parser P1 semantic validation

on:
  pull_request:
    branches:
      - release/nexo-3.7.0-beta19
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          GRADLE_DIR="${RUNNER_TEMP}/gradle-8.9"
          EXPECTED_SHA256="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          curl -L --fail --retry 3 -o "${GRADLE_ZIP}" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          ACTUAL_SHA256="$(sha256sum "${GRADLE_ZIP}" | awk '{print $1}')"
          [ "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}" ]
          unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${GRADLE_DIR}/bin/gradle" >> "${GITHUB_ENV}"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-34"

      - name: Prepare transcription runtime
        shell: bash
        run: sh prepare-transcription-runtime.sh

      - name: Existing regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          sh -n build-on-phone.sh
          python3 validation/test-version-identity.py
          python3 validation/test-beta16-time-voice.py
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          python3 validation/test-event-people-assignment.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv

      - name: Semantic parser smoke tests
        shell: bash
        run: |
          cat > /tmp/EventSemanticSmoke.java <<'JAVA'
          import com.jruiz.nexo.core.*;
          import java.time.*;

          public final class EventSemanticSmoke {
              private static void check(boolean ok, String message) {
                  if (!ok) throw new AssertionError(message);
              }
              public static void main(String[] args) {
                  LocalDateTime now=LocalDateTime.of(2026,10,1,10,0);

                  String r44="Cita para una revisión del implante dental";
                  check("Revisión del implante dental".equals(
                      LocalTitleEngine.derive(r44,"event","Salud / Médico","","")),
                      "R44 título semántico");

                  String rich="Cita para revisión del implante en Clínica Roble con la doctora Vega el 8 de octubre. Llevar informe del 12 de septiembre.";
                  check("Clínica Roble".equals(LocationParser.extract(rich)), "lugar sin profesional");
                  String details=DescriptionExtractor.extract(rich,"Clínica Roble");
                  check(TemporalParser.norm(details).contains("doctora vega"), "profesional conservado");
                  check(TemporalParser.norm(details).contains("informe del 12 de septiembre"), "fecha documental conservada");

                  TemporalParser.Result r23=TemporalParser.parse(
                      "Llevar el informe del 12 de septiembre. Cita el 8 de octubre a las 10:00",now);
                  check(r23.hasDate && LocalDate.of(2026,10,8).equals(r23.date), "R23 fecha cita");
                  TemporalParser.Result r22=TemporalParser.parse(
                      "Cita el 8 de octubre a las 10:00. Llevar el informe del 12 de septiembre",now);
                  check(r22.hasDate && LocalDate.of(2026,10,8).equals(r22.date), "R22 fecha cita");
              }
          }
          JAVA
          mkdir -p /tmp/nexo-semantic-smoke
          javac -d /tmp/nexo-semantic-smoke             app/src/main/java/com/jruiz/nexo/core/TemporalParser.java             app/src/main/java/com/jruiz/nexo/core/EventSemanticParser.java             app/src/main/java/com/jruiz/nexo/core/LocalTitleEngine.java             app/src/main/java/com/jruiz/nexo/core/DescriptionExtractor.java             app/src/main/java/com/jruiz/nexo/core/LocationParser.java             /tmp/EventSemanticSmoke.java
          java -cp /tmp/nexo-semantic-smoke EventSemanticSmoke

      - name: Time-zone JS smoke tests
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const src=fs.readFileSync('app/src/main/assets/app.js','utf8');
          const a=src.indexOf("function dateTimeToMs(date,time='')");
          const b=src.indexOf('function displayAnalysisDate',a);
          const c=src.indexOf('function eventEndFromFields');
          const d=src.indexOf('function durationMinutesBetween',c);
          if(a<0||b<0||c<0||d<0)throw new Error('Funciones de zona horaria no encontradas');
          const ctx={Intl,Date,Number,String,Math};
          vm.createContext(ctx);
          vm.runInContext(src.slice(a,b)+src.slice(c,d),ctx);
          const ny=ctx.dateTimeToMsInZone('2026-10-08','17:30','America/New_York');
          const madrid=ctx.dateTimeToMsInZone('2026-10-08','17:30','Europe/Madrid');
          if(ny!==Date.UTC(2026,9,8,21,30))throw new Error('Nueva York incorrecto: '+ny);
          if(madrid!==Date.UTC(2026,9,8,15,30))throw new Error('Madrid incorrecto: '+madrid);
          if(ny-madrid!==6*60*60*1000)throw new Error('Diferencia de zona incorrecta');
          if(ctx.dateTimeToMsInZone('2026-03-08','02:30','America/New_York')!==0)throw new Error('Hora inexistente DST aceptada');
          const start=ctx.dateTimeToMsInZone('2026-10-24','22:00','Europe/Madrid');
          const end=ctx.eventEndFromFields('2026-10-24','22:00','2026-10-24','06:00',false,'Europe/Madrid');
          if((end-start)/3600000!==9)throw new Error('Fin nocturno con cambio de hora incorrecto');
          NODE

      - name: Compile Android debug
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "${GRADLE_89}" assembleDebug --no-daemon --max-workers=1
