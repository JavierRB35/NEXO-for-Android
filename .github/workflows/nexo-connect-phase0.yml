name: Nexo Connect · Phase 0 crypto proof

on:
  push:
    branches:
      - 'experiment/nexo-connect-*'
    paths:
      - 'experiments/nexo-connect-crypto/**'
      - '.github/workflows/nexo-connect-phase0.yml'
      - 'experiments/nexo-connect-android-vault/**'
      - 'supabase/nexo-connect/**'
  pull_request:
    paths:
      - 'experiments/nexo-connect-crypto/**'
      - '.github/workflows/nexo-connect-phase0.yml'
      - 'experiments/nexo-connect-android-vault/**'
      - 'supabase/nexo-connect/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdk17-crypto-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run isolated cryptographic tests
        env:
          JAVA_OPTS: -Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
        run: gradle -p experiments/nexo-connect-crypto test --no-daemon --max-workers=1 --stacktrace
      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-connect-phase0-test-reports
          path: experiments/nexo-connect-crypto/build/test-results/test/
          if-no-files-found: warn
          retention-days: 14

  postgres-rls-policy-tests:
    name: Test Supabase-style permissions in PostgreSQL 16
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: nexo_connect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Check schema, RLS and separation across three test accounts
        env:
          PGPASSWORD: test-only-password
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGDATABASE: nexo_connect_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/nexo-connect/tests/auth-stub.sql
          psql -v ON_ERROR_STOP=1 -f supabase/nexo-connect/migrations/202610200001_identity_contacts.sql
          psql -v ON_ERROR_STOP=1 -f supabase/nexo-connect/tests/test-identity-contacts-rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/nexo-connect/migrations/202610200002_contact_api.sql
          psql -v ON_ERROR_STOP=1 -f supabase/nexo-connect/tests/test-contact-api.sql

  android-keystore-compile:
    name: Compile isolated Android vault with SDK 34
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK 34
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
      - name: Compile Android vault and instrumented tests
        env:
          JAVA_OPTS: -Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
        run: gradle -p experiments/nexo-connect-android-vault :vault:assembleDebugAndroidTest --no-daemon --max-workers=1 --stacktrace

  android-keystore-emulator:
    name: Android 34 emulator tests (Keystore real)
    needs: android-keystore-compile
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run tests in Android 34 emulator, not user's phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: gradle -p experiments/nexo-connect-android-vault :vault:connectedDebugAndroidTest --no-daemon --max-workers=1 --stacktrace
