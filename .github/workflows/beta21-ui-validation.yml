name: Beta21 UI and branding validation

on:
  push:
    branches:
      - work/nexo-3.7.0-beta21-ui-compact-branding
  pull_request:
    branches:
      - release/nexo-3.7.0-beta20
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          GRADLE_DIR="${RUNNER_TEMP}/gradle-8.9"
          EXPECTED_SHA256="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          curl -L --fail --retry 3 -o "${GRADLE_ZIP}" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          ACTUAL_SHA256="$(sha256sum "${GRADLE_ZIP}" | awk '{print $1}')"
          [ "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}" ]
          unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${GRADLE_DIR}/bin/gradle" >> "${GITHUB_ENV}"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-34"

      - name: Prepare transcription runtime
        run: sh prepare-transcription-runtime.sh

      - name: JavaScript syntax
        run: node --check app/src/main/assets/app.js

      - name: Version identity
        run: python3 validation/test-version-identity.py

      - name: Compact forms regression
        run: python3 validation/test-form-familia-ui.py

      - name: Branding resources regression
        run: python3 validation/test-branding-resources.py

      - name: Existing event regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          python3 validation/test-event-people-assignment.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv

      - name: Compile Android debug
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "${GRADLE_89}" assembleDebug --no-daemon --max-workers=1

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexo_3_7_0_beta21_debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
