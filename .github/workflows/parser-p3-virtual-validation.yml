name: Parser P3 virtual meeting validation

on:
  pull_request:
    branches:
      - work/nexo-beta21-parser-p2-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_ZIP="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          GRADLE_DIR="${RUNNER_TEMP}/gradle-8.9"
          EXPECTED_SHA256="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          curl -L --fail --retry 3 -o "${GRADLE_ZIP}" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          ACTUAL_SHA256="$(sha256sum "${GRADLE_ZIP}" | awk '{print $1}')"
          [ "${ACTUAL_SHA256}" = "${EXPECTED_SHA256}" ]
          unzip -q "${GRADLE_ZIP}" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${GRADLE_DIR}/bin/gradle" >> "${GITHUB_ENV}"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-34"

      - name: Prepare transcription runtime
        run: sh prepare-transcription-runtime.sh

      - name: Existing regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          python3 validation/test-version-identity.py
          python3 validation/test-form-familia-ui.py
          python3 validation/test-branding-resources.py
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv

      - name: Virtual meeting smoke tests
        shell: bash
        run: |
          cat > /tmp/VirtualMeetingSmoke.java <<'JAVA'
          package com.jruiz.nexo.core;

          public final class VirtualMeetingSmoke {
              private static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
              public static void main(String[] args) {
                  String teams="Reunión de presupuesto por Teams el 7 de octubre de 2026 a las 17:00. Enlace https://teams.microsoft.com/l/meetup-join/abc123?context=%7B%22Tid%22%3A%22x%22%7D";
                  EventSemanticParser.VirtualMeeting t=EventSemanticParser.virtualMeeting(teams);
                  check("Microsoft Teams".equals(t.modality),"Teams modalidad");
                  check(t.url.equals("https://teams.microsoft.com/l/meetup-join/abc123?context=%7B%22Tid%22%3A%22x%22%7D"),"Teams URL completa");
                  String description=DescriptionExtractor.extract(teams,"");
                  check(TemporalParser.norm(description).contains("microsoft teams"),"Teams en descripción");
                  check(description.contains(t.url),"Teams URL preservada");

                  String zoom="Consulta virtual por Zoom https://acme.zoom.us/j/123456789?pwd=AbC-123.";
                  EventSemanticParser.VirtualMeeting z=EventSemanticParser.virtualMeeting(zoom);
                  check("Zoom".equals(z.modality),"Zoom modalidad");
                  check("https://acme.zoom.us/j/123456789?pwd=AbC-123".equals(z.url),"Zoom URL sin puntuación final");

                  String meet="Reunión online: https://meet.google.com/abc-defg-hij";
                  EventSemanticParser.VirtualMeeting g=EventSemanticParser.virtualMeeting(meet);
                  check("Google Meet".equals(g.modality),"Meet modalidad por dominio");
                  check(g.url.endsWith("/abc-defg-hij"),"Meet URL");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp/nexo-parser-regression -d /tmp/nexo-parser-regression /tmp/VirtualMeetingSmoke.java
          java -cp /tmp/nexo-parser-regression com.jruiz.nexo.core.VirtualMeetingSmoke

      - name: Compile Android debug
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "${GRADLE_89}" assembleDebug --no-daemon --max-workers=1
