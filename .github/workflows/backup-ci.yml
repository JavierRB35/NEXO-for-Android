name: Nexo · Verify single-file backup
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/jruiz/nexo/MainActivity.java'
      - 'app/src/main/java/com/jruiz/nexo/backup/**'
      - 'app/src/main/assets/app.js'
      - 'validation/test-auto-backup.py'
      - 'app/build.gradle'
      - '.github/workflows/backup-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate backup behavior
        run: |
          python3 validation/test-auto-backup.py
          node --check app/src/main/assets/app.js
      - name: Install pinned Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          URL="https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          curl -fL --retry 3 -o "${RUNNER_TEMP}/gradle-8.9-bin.zip" "$URL"
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  ${RUNNER_TEMP}/gradle-8.9-bin.zip" | sha256sum -c -
          unzip -q "${RUNNER_TEMP}/gradle-8.9-bin.zip" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${RUNNER_TEMP}/gradle-8.9/bin/gradle" >> "${GITHUB_ENV}"
      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
      - name: Prepare transcription runtime
        run: sh prepare-transcription-runtime.sh
      - name: Compile debug APK and Android code
        run: |
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "$GRADLE_89" assembleDebug --no-daemon --max-workers=1
