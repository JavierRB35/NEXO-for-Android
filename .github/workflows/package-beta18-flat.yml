name: package-beta18-flat

on:
  push:
    branches:
      - work/nexo-3.7.0-beta18-supabase-sync
      - release/nexo-3.7.0-beta18
  workflow_dispatch:

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate beta18
        shell: bash
        run: |
          node --check app/src/main/assets/app.js
          sh -n build-on-phone.sh
          sh ./prepare-transcription-runtime.sh
          JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8" gradle compileDebugJavaWithJavac --no-daemon --max-workers=1
          python3 validation/test-version-identity.py
          python3 validation/test-nexo-familia-migration.py
          python3 validation/test-nexo-familia-cloud-sync.py
          python3 validation/test-home-familia-parity.py
          python3 validation/test-beta13-interactions.py
          python3 validation/test-beta14-gmail.py
          python3 validation/test-beta15-voice-holidays.py
          python3 validation/test-beta16-time-voice.py
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          python3 validation/test-people-settings.py
          python3 validation/test-event-people-assignment.py
          python3 validation/test-transcription-integration.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv
      - name: Create flat source ZIP
        shell: bash
        run: |
          rm -f Nexo_3_7_0_beta18.zip
          zip -r Nexo_3_7_0_beta18.zip . \
            -x '.git/*' \
               '.github/workflows/package-beta12-flat.yml' \
               '.github/workflows/package-beta13-flat.yml' \
               '.github/workflows/package-beta14-flat.yml' \
               '.github/workflows/package-beta15-flat.yml' \
               '.github/workflows/package-beta16-flat.yml' \
               '.github/workflows/package-beta17-flat.yml' \
               '.github/workflows/package-beta18-flat.yml' \
               'Nexo_3_7_0_beta18.zip' \
               'app/build/*' \
               '.gradle/*'
      - uses: actions/upload-artifact@v4
        with:
          name: Nexo_3_7_0_beta18
          path: Nexo_3_7_0_beta18.zip
          if-no-files-found: error
