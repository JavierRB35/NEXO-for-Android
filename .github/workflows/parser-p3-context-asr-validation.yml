name: Parser P3 context and ASR validation

on:
  pull_request:
    branches:
      - work/nexo-beta21-parser-p2-complete
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${RUNNER_TEMP}/gradle-8.9-bin.zip"
          SHA="d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab"
          curl -L --fail --retry 3 -o "${ZIP}" "https://services.gradle.org/distributions/gradle-8.9-bin.zip"
          [ "$(sha256sum "${ZIP}" | awk '{print $1}')" = "${SHA}" ]
          unzip -q "${ZIP}" -d "${RUNNER_TEMP}"
          echo "GRADLE_89=${RUNNER_TEMP}/gradle-8.9/bin/gradle" >> "${GITHUB_ENV}"

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          [ -n "${SDKMANAGER}" ] && [ -x "${SDKMANAGER}" ]
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" "platforms;android-34"

      - name: Prepare transcription runtime
        run: sh prepare-transcription-runtime.sh

      - name: Existing regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app/src/main/assets/app.js
          sh -n build-on-phone.sh
          python3 validation/test-version-identity.py
          python3 validation/test-beta16-time-voice.py
          python3 validation/test-beta17-event-edit-home.py
          python3 validation/test-temporal-status.py
          python3 validation/test-event-people-assignment.py
          python3 validation/test-form-familia-ui.py
          python3 validation/test-branding-resources.py
          sh validation/regression/run-benchmark.sh validation/regression/data/beta16_time_cases.tsv

      - name: Capture context smoke tests
        shell: bash
        run: |
          cat > /tmp/ContextSmoke.java <<'JAVA'
          package com.jruiz.nexo.core;

          import java.time.Instant;

          public final class ContextSmoke {
              private static void check(boolean ok,String msg){if(!ok)throw new AssertionError(msg);}
              public static void main(String[] args) {
                  long captured=Instant.parse("2026-10-01T10:00:00Z").toEpochMilli();
                  ParseContext ctx=ParseContext.at(captured);

                  RuleClassifier.Result a=AppointmentParser.parse("Cita mañana a las 10:00",ctx);
                  RuleClassifier.Result b=AppointmentParser.parse("Cita mañana a las 10:00",ctx);
                  check("2026-10-02".equals(a.dueDate),"mañana desde reloj fijo");
                  check(a.dueDate.equals(b.dueDate)&&a.dueTime.equals(b.dueTime),"reinterpretación estable");
                  check(a.parseContext.capturedAtMillis==captured,"capturedAt conservado");
                  check(ParseContext.PARSER_VERSION.equals(a.toJson().optString("parserVersion")),"versión parser expuesta");

                  RecurrenceEngine.Detection r=RecurrenceEngine.detect("cada semana hasta mañana",ctx.localDateTime());
                  check("2026-10-02".equals(r.untilDate),"límite relativo usa el mismo reloj");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp/nexo-parser-regression -d /tmp/nexo-parser-regression \
            app/src/main/java/com/jruiz/nexo/core/AppointmentParser.java \
            /tmp/ContextSmoke.java
          java -cp /tmp/nexo-parser-regression com.jruiz.nexo.core.ContextSmoke

      - name: Voice alternatives source guards
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('app/src/main/java/com/jruiz/nexo/MainActivity.java').read_text()
          js=Path('app/src/main/assets/app.js').read_text()
          service=Path('app/src/main/java/com/jruiz/nexo/core/NexoService.java').read_text()
          assert main.count('EXTRA_MAX_RESULTS, 3') >= 2
          assert 'RecognizerIntent.EXTRA_CONFIDENCE_SCORES' in main
          assert 'RecognizerIntent.EXTRA_BIASING_STRINGS' in main
          assert 'speechBiasingStrings()' in main and 'db.getPeople()' in main
          assert 'onVoiceRecognition' in main and 'speechRecognitionPayload' in main
          assert 'onVoiceRecognition(raw)' in js
          assert 'showVoiceHypothesisPicker' in js and 'voiceCriticalSignature' in js
          assert 'captureCapturedAt' in js and 'capturedAt:ensureCaptureCapturedAt()' in js
          assert 'classifyAppointmentProposalsAt' in js
          assert 'ParseContext.at(capturedAt' in service
          print('Context + ASR alternatives guards: OK')
          PY

      - name: Compile Android debug
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_OPTS="-Xmx768m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8"
          "${GRADLE_89}" assembleDebug --no-daemon --max-workers=1
