plugins { id 'com.android.application' }
android {
    namespace 'com.jruiz.nexo.connect.vault.pilot'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jruiz.nexo.connect.pilot'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0-lab'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':vault')
    implementation 'com.google.crypto.tink:tink:1.18.0'
}
